name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      skip_publish:
        description: 'Skip npm publish and GitHub release (mcpb test build only)'
        type: boolean
        default: true

permissions:
  contents: write
  id-token: write

jobs:
  publish-and-release:
    name: Publish and release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            VERSION="$(node -p "require('./package.json').version")"
          else
            TAG="${GITHUB_REF_NAME}"
            VERSION="${TAG#v}"

            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid release tag: $TAG"
              exit 1
            fi

            echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.5.1

      - name: Validate package version
        if: github.event_name == 'push'
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          if [[ "$PACKAGE_VERSION" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Tag version ${{ steps.version.outputs.version }} does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

          MANIFEST_VERSION="$(node -p "require('./manifest.json').version")"

          if [[ "$MANIFEST_VERSION" != "${{ steps.version.outputs.version }}" ]]; then
            echo "Tag version ${{ steps.version.outputs.version }} does not match manifest.json version $MANIFEST_VERSION"
            exit 1
          fi

      - name: Validate changelog entry
        if: github.event_name == 'push'
        shell: bash
        run: |
          if ! grep -q "^## ${{ steps.version.outputs.version }} " CHANGELOG.md; then
            echo "CHANGELOG.md does not contain an entry for version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Validate tag commit is on main
        if: github.event_name == 'push'
        shell: bash
        run: |
          git fetch origin main --depth=1

          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tagged commit $GITHUB_SHA is not contained in origin/main"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Validate MCPB manifest
        run: npx --yes @anthropic-ai/mcpb validate manifest.json

      - name: Build
        run: npm run build

      - name: Run sanity test without external API
        run: npm test
        env:
          GEMINI_API_KEY: ''

      - name: Verify publish package contents
        run: npm publish --dry-run
        env:
          GEMINI_API_KEY: ''

      - name: Pack npm artifact
        if: github.event_name == 'push'
        run: npm pack

      - name: Download cross-platform sharp binaries for MCPB
        shell: bash
        run: |
          # npm skips optional packages whose 'os'/'cpu' fields don't match the current
          # platform (Linux), so we download tarball URLs from the registry directly.
          download_pkg() {
            local PKG="$1"
            local VER="$2"
            local DIR="node_modules/@img/${PKG}"
            if [ -d "$DIR" ]; then echo "skip (exists): $DIR"; return; fi
            local URL
            URL=$(curl -sf "https://registry.npmjs.org/@img/${PKG}/${VER}" | jq -r '.dist.tarball')
            mkdir -p "$DIR"
            curl -sL "$URL" | tar -xz -C "$DIR" --strip-components=1
            echo "downloaded: $DIR"
          }

          SHARP_VER=$(node -p "require('./package-lock.json').packages['node_modules/@img/sharp-win32-x64'].version")
          LIBVIPS_VER=$(node -p "require('./package-lock.json').packages['node_modules/@img/sharp-libvips-darwin-arm64'].version")

          # Windows x64 (self-contained, no libvips dep)
          download_pkg "sharp-win32-x64"            "$SHARP_VER"

          # macOS ARM64
          download_pkg "sharp-darwin-arm64"         "$SHARP_VER"
          download_pkg "sharp-libvips-darwin-arm64" "$LIBVIPS_VER"

          # macOS x64
          download_pkg "sharp-darwin-x64"           "$SHARP_VER"
          download_pkg "sharp-libvips-darwin-x64"   "$LIBVIPS_VER"

          # Linux ARM64
          download_pkg "sharp-linux-arm64"          "$SHARP_VER"
          download_pkg "sharp-libvips-linux-arm64"  "$LIBVIPS_VER"

      - name: Pack MCPB bundle
        shell: bash
        run: |
          npx --yes @anthropic-ai/mcpb pack . mcp-alphabanana-${{ steps.version.outputs.version }}.mcpb
          cp mcp-alphabanana-${{ steps.version.outputs.version }}.mcpb mcp-alphabanana-latest.mcpb

      - name: Upload MCPB artifact (test build)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: mcpb-test-build
          path: '*.mcpb'
          retention-days: 7

      - name: Publish to npm
        if: github.event_name == 'push'
        run: npm publish
        env:
          GEMINI_API_KEY: ''

      - name: Create GitHub release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            *.tgz
            mcp-alphabanana-${{ steps.version.outputs.version }}.mcpb
            mcp-alphabanana-latest.mcpb